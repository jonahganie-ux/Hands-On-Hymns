name: Deploy Hands-On Hymns to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Find the website folder
        id: site-dir
        shell: bash
        run: |
          if [ -f "Hands-On Hymns/index.html" ]; then
            echo "path=Hands-On Hymns" >> "$GITHUB_OUTPUT"
          else
            echo "path=." >> "$GITHUB_OUTPUT"
          fi

      - name: Upload website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.site-dir.outputs.path }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
